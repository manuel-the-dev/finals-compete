name: Backup database

# Daily full dump of the production database. The dump is restored into a
# throw-away Postgres to prove it is usable, then encrypted and stored as a
# GitHub artifact, i.e. outside the database provider.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    services:
      restore:
        image: postgres:17
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore_check
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U restore" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: echo "DUMP=$(bash scripts/backup.sh backups)" >> "$GITHUB_ENV"
      - name: Restore test
        env:
          TARGET_DATABASE_URL: postgres://restore:restore@localhost:5433/restore_check
        run: bash scripts/restore.sh "$DUMP"
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || (echo "Secret BACKUP_PASSPHRASE fehlt" && exit 1)
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 --output "$DUMP.gpg" "$DUMP"
          rm "$DUMP"
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
