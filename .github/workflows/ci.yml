name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fc
          POSTGRES_PASSWORD: fc
          POSTGRES_DB: finals_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://fc:fc@localhost:5432/finals_test
      TEST_DATABASE_URL: postgres://fc:fc@localhost:5432/finals_test
      SESSION_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Create restore-test database
        run: PGPASSWORD=fc psql -h localhost -U fc -d finals_test -c "CREATE DATABASE finals_test_restore"
      - run: npm test
      - name: Migrations are in sync with the schema
        run: |
          npx drizzle-kit generate --name ci-check
          test -z "$(git status --porcelain drizzle)" || (echo "Schema geändert ohne Migration: npm run db:generate ausführen" && exit 1)
      - name: Backup and restore round trip
        env:
          TARGET_DATABASE_URL: postgres://fc:fc@localhost:5432/finals_test_restore
        run: |
          npm run db:migrate
          npm run db:seed-demo
          DUMP=$(bash scripts/backup.sh /tmp/backups)
          bash scripts/restore.sh "$DUMP"
      - run: npx next build
